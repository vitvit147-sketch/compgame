    <script>
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');

          root.innerHTML = '<div style="min-height:100dvh;background:#030712;color:#f8fafc;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-family:system-ui,sans-serif;"><div style="font-size:48px;margin-bottom:16px;">⚠️</div><h2 style="font-size:20px;font-weight:900;color:#f87171;margin-bottom:8px;">Ошибка скрипта</h2><p style="font-size:12px;color:#fca5a5;font-family:monospace;max-width:400px;word-break:break-all;margin-bottom:20px;background:rgba(239,68,68,0.1);padding:12px;border-radius:12px;border:1px solid rgba(239,68,68,0.3);">' + (e.message || 'Ошибка загрузки приложения') + '</p><button onclick="sessionStorage.clear();localStorage.clear();location.reload();" style="padding:14px 24px;background:#f59e0b;color:#030712;font-weight:900;border-radius:16px;border:none;cursor:pointer;font-size:15px;">Сбросить кеш и перезагрузить 🔄</button></div>';
        }
      });
    </script>
    <style>

        color: #f8fafc;

    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-amber-500 selection:text-black">

        <div style="width: 72px; height: 72px; border-radius: 20px; background: rgba(245, 158, 11, 0.15); border: 2px solid rgba(245, 158, 11, 0.4); display: flex; align-items: center; justify-content: center; font-size: 36px; margin-bottom: 20px; box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.2);">

      </div>

        @keyframes spin {
          to { transform: rotate(360deg); }
